apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: p1-local
spec:
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: p1-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: docker.io/grafana/loki:3.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3100
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: p1-local
data:
  p1-loki.yaml: |
    apiVersion: 1
    datasources:
    - name: P1 Loki
      type: loki
      access: proxy
      url: http://loki.p1-local.svc.cluster.local:3100
      isDefault: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: p1-local
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: p1-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: docker.io/grafana/grafana:12.3.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources/p1-loki.yaml
          subPath: p1-loki.yaml
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources