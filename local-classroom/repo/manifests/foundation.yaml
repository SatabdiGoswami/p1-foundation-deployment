apiVersion: v1
kind: ConfigMap
metadata:
  name: foundation-settings
  namespace: p1-local
data:
  LAB_ENV: "workshop-blue"
  LAB_SESSION: "p1-local"
  LOCAL_LOKI_URL: "http://loki.p1-local.svc.cluster.local:3100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundation
  namespace: p1-local
  labels:
    app: foundation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foundation
  template:
    metadata:
      labels:
        app: foundation
      annotations:
        academy/config-revision: "2"
    spec:
      containers:
      - name: foundation
        image: localhost/p1-local:foundation-a
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: foundation-settings
        env:
        - name: DOTNET_PROCESSOR_COUNT
          value: "1"
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: foundation
  namespace: p1-local
spec:
  selector:
    app: foundation
  ports:
  - name: http
    port: 8080
    targetPort: http