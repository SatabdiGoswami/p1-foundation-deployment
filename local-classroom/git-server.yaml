apiVersion: v1
kind: Namespace
metadata:
  name: p1-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-git
  namespace: p1-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p1-git
  template:
    metadata:
      labels:
        app: p1-git
    spec:
      containers:
      - name: git-http
        image: quay.io/argoproj/argocd:v3.6.2
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - mkdir -p /git && exec git daemon --verbose --reuseaddr --base-path=/git --export-all --enable=receive-pack --port=9418 /git
        ports:
        - name: git
          containerPort: 9418
        readinessProbe:
          tcpSocket:
            port: git
          periodSeconds: 5
        volumeMounts:
        - name: repositories
          mountPath: /git
      volumes:
      - name: repositories
        emptyDir: {}
      securityContext:
        fsGroup: 999
---
apiVersion: v1
kind: Service
metadata:
  name: p1-git
  namespace: p1-local
spec:
  selector:
    app: p1-git
  ports:
  - name: git
    port: 9418
    targetPort: git